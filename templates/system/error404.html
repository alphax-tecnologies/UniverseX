<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#09070a">
<title>Página não encontrada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09070a;
    --card: rgba(18,15,19,.86);
    --border: rgba(255,255,255,.08);
    --text: #f4eef2;
    --muted: #9a919a;
    --accent: #ffffff;
    --on-accent: #000000;
    --grad: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 50%, #000));
    --pad: clamp(14px, 4.5vw, 26px);
    --nav-h: 64px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html { height: 100%; -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100%; background: var(--bg); color: var(--text);
    font-family: "Outfit", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 40px);
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(70% 45% at 15% 0%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 70%),
      radial-gradient(60% 40% at 100% 55%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
      radial-gradient(60% 40% at 0% 100%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%);
  }
  a { color: inherit; text-decoration: none; }
  .app { max-width: 720px; margin: 0 auto; padding: 0 var(--pad); }
  .view { animation: in .35s cubic-bezier(.4,0,.2,1); }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .wrap {
    min-height: calc(100vh - var(--nav-h) - env(safe-area-inset-bottom, 0px) - 60px);
    min-height: calc(100dvh - var(--nav-h) - env(safe-area-inset-bottom, 0px) - 60px);
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; max-width: 460px; text-align: center;
    background: var(--card); border: 1px solid var(--border); border-radius: 24px;
    padding: clamp(24px, 7vw, 40px) clamp(16px, 5vw, 28px);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }

  /* Disco de vinil girando (só gradientes) */
  .disc {
    width: clamp(96px, 28vw, 128px); aspect-ratio: 1; margin: 0 auto 18px; border-radius: 50%;
    background:
      radial-gradient(circle, var(--bg) 0 7%, var(--accent) 7.5% 22%, #17121a 22.5% 100%),
      conic-gradient(from 0deg, #1d171f, #2c242f, #1d171f, #322936, #1d171f);
    background-blend-mode: normal;
    border: 1px solid var(--border);
    box-shadow: 0 8px 26px rgba(0,0,0,.5);
    animation: spin 7s linear infinite;
    position: relative;
  }
  .disc::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 20deg, transparent 0 20%, rgba(255,255,255,.12) 25%, transparent 30% 70%, rgba(255,255,255,.1) 75%, transparent 80%);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .code {
    font-size: clamp(4.2rem, 24vw, 7rem); font-weight: 600; letter-spacing: -.04em; line-height: 1;
    background: var(--grad); -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
  }
  h1 { margin-top: 10px; font-size: clamp(1.25rem, 6vw, 1.6rem); font-weight: 500; letter-spacing: -.01em; }
  .msg { margin-top: 8px; color: var(--muted); font-size: clamp(.88rem, 3.6vw, 1rem); line-height: 1.5; }
  .path {
    display: inline-block; max-width: 100%; margin-top: 14px; padding: .4em 1em; border-radius: 999px;
    border: 1px solid var(--border); background: #0c0a0d; color: var(--muted); font-size: .82rem;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: top;
  }
  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
  .btn {
    display: grid; place-items: center; width: 100%; height: 50px; border-radius: 999px; cursor: pointer;
    background: var(--grad); color: var(--on-accent); font-weight: 600; font-size: 1rem;
    transition: transform .1s;
  }
  .btn:active { transform: scale(.98); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid rgba(255,255,255,.2); font-weight: 500; }
  .btn:focus-visible, .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Navegação inferior (nenhuma aba ativa em páginas de erro) */
  .nav {
    position: fixed; z-index: 10; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    display: flex; justify-content: center; padding: 0 var(--pad); pointer-events: none;
  }
  .bar {
    pointer-events: auto; display: flex; align-items: center; gap: 4px; width: 100%; max-width: 420px;
    height: var(--nav-h); padding: 6px; border-radius: 999px;
    background: rgba(16,13,17,.92); border: 1px solid var(--border);
    box-shadow: 0 12px 34px rgba(0,0,0,.55);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
  .tab {
    flex: 1 1 0; min-width: 0; height: 100%; border-radius: 999px; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-size: .68rem;
  }
  .tab svg { width: 22px; height: 22px; }
  @media (max-width: 360px) { .tab { font-size: .62rem; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <main class="view wrap">
    <section class="card" aria-labelledby="t">
      <div class="disc" aria-hidden="true"></div>
      <p class="code" aria-hidden="true">404</p>
      <h1 id="t">Página não encontrada</h1>
      <p class="msg">Parece que essa faixa não existe. O endereço pode ter mudado ou nunca ter existido.</p>
      <span class="path" id="path" hidden></span>
      <div class="actions">
        <a class="btn" href="/">Voltar ao início</a>
        <a class="btn ghost" href="/search">Buscar músicas</a>
      </div>
    </section>
  </main>
</div>

<nav class="nav" aria-label="Principal">
  <div class="bar">
    <a class="tab" href="/">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.7 3 9.4V21h6.5v-6.5h5V21H21V9.4z"/></svg><span>Início</span>
    </a>
    <a class="tab" href="/search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>Buscar</span>
    </a>
    <a class="tab" href="/library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 4v16M10 4v16M15 6l5 13"/></svg><span>Biblioteca</span>
    </a>
  </div>
</nav>

<!-- Dados do Flask (opcional, só para a cor). Formato: {"name": "Nome" | null, "color": "#ff4d6d" | null, "data": null} -->
<script id="flask-data" type="application/json">{{ (payload or {})|tojson }}</script>
<script>
  var raw = {};
  try { raw = JSON.parse(document.getElementById('flask-data').textContent) || {}; } catch (e) {}
  var color = raw.color;
  if (typeof color === 'string') color = color.trim();
  if (!color || /^(none|null)$/i.test(color) || !(window.CSS && CSS.supports('color', color))) color = '#ffffff';

  var root = document.documentElement;
  root.style.setProperty('--accent', color);
  var probe = document.createElement('span');
  probe.style.color = color;
  document.body.appendChild(probe);
  var rgb = (getComputedStyle(probe).color.match(/[\d.]+/g) || [255, 255, 255]).map(Number);
  document.body.removeChild(probe);
  var lum = (0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2]) / 255;
  root.style.setProperty('--on-accent', lum > 0.55 ? '#000000' : '#ffffff');

  // Mostra o endereço que não foi encontrado
  var p = document.getElementById('path');
  p.textContent = location.pathname;
  p.hidden = false;
</script>
</body>
</html>
