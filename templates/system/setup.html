<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#09070a">
<title>Criar perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09070a;
    --card: rgba(18,15,19,.86);
    --border: rgba(255,255,255,.08);
    --text: #f4eef2;
    --muted: #9a919a;
    --accent: #ffffff;
    --on-accent: #000000;
    --grad: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 50%, #000));
    --pad: clamp(14px, 4.5vw, 26px);
    box-sizing: border-box;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html { height: 100%; -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100%; background: var(--bg); color: var(--text);
    font-family: "Outfit", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + var(--pad)) var(--pad) calc(env(safe-area-inset-bottom, 0px) + var(--pad));
  }
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(70% 45% at 15% 0%, color-mix(in srgb, var(--accent) 24%, transparent), transparent 70%),
      radial-gradient(60% 40% at 100% 55%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%),
      radial-gradient(60% 40% at 0% 100%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%);
    transition: background .3s;
  }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .wrap { width: 100%; max-width: 440px; animation: in .35s cubic-bezier(.4,0,.2,1); }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .head { padding: 0 4px 18px; }
  .head h1 { font-size: clamp(1.6rem, 8vw, 2.2rem); font-weight: 400; letter-spacing: -.02em; line-height: 1.1; }
  .head h1 em { font-style: normal; color: var(--accent); }
  .head p { margin-top: 6px; color: var(--muted); font-size: clamp(.85rem, 3.5vw, .95rem); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 24px;
    padding: clamp(16px, 5vw, 24px);
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .field + .field { margin-top: 20px; }
  label.lbl { display: block; margin: 0 4px 8px; font-weight: 500; font-size: .95rem; }
  .hint { margin: 6px 4px 0; color: var(--muted); font-size: .82rem; line-height: 1.4; }

  .input {
    display: flex; align-items: center; gap: 10px; background: #0c0a0d; border: 1px solid var(--border);
    border-radius: 999px; padding: 0 16px; height: 50px;
  }
  .input:focus-within { border-color: var(--accent); }
  .input input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; font-size: 1rem; }
  .input input::placeholder { color: var(--muted); }
  .input.bad { border-color: #ff8a9b; }

  .color-row { display: flex; align-items: center; gap: 12px; }
  .swatch {
    flex: none; position: relative; width: 50px; aspect-ratio: 1; border-radius: 50%;
    border: 1px solid var(--border); overflow: hidden; cursor: pointer;
    background: var(--accent);
  }
  .swatch input[type="color"] {
    position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px);
    border: 0; padding: 0; opacity: 0; cursor: pointer;
  }
  .swatch:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
  .color-row .input { flex: 1; }
  .input .hash { color: var(--muted); }
  .input input.hex { font-variant-numeric: tabular-nums; letter-spacing: .04em; text-transform: lowercase; }

  .btn {
    width: 100%; height: 50px; margin-top: 24px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--grad); color: var(--on-accent); font-weight: 600; font-size: 1rem;
    transition: transform .1s, opacity .2s;
  }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .status { min-height: 1.3em; margin: 12px 4px 0; font-size: .88rem; color: var(--muted); }
  .status.err { color: #ff8a9b; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <h1>Crie seu <em>perfil</em></h1>
    <p>Escolha seu nome de usuário e a cor do aplicativo.</p>
  </div>

  <form class="card" id="form" method="post" novalidate>
    <div class="field">
      <label class="lbl" for="username">Nome de usuário</label>
      <div class="input" id="userBox">
        <input id="username" name="name" type="text" autocomplete="username" autocapitalize="off"
               spellcheck="false" maxlength="30" required placeholder="Como você quer ser chamado?"
               aria-describedby="status">
      </div>
    </div>

    <div class="field">
      <label class="lbl" for="hex">Cor do aplicativo</label>
      <div class="color-row">
        <label class="swatch" id="swatch" title="Escolher cor">
          <span class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Abrir seletor de cores</span>
          <input type="color" id="picker" value="#ffffff" aria-label="Seletor de cor">
        </label>
        <div class="input" id="hexBox">
          <span class="hash" aria-hidden="true">#</span>
          <input class="hex" id="hex" name="appcolor" type="text" inputmode="text" autocomplete="off" autocapitalize="off"
                 spellcheck="false" maxlength="7" placeholder="ffffff" aria-describedby="hexHint status">
        </div>
      </div>
      <p class="hint" id="hexHint">Toque no círculo para escolher ou digite o código hexadecimal (ex.: ff4d6d).</p>
    </div>

    <input type="hidden" name="color" id="color" value="#ffffff">

    <button class="btn" id="btn" type="submit">Continuar</button>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </form>
</main>

<script id="flask-data" type="application/json">{{ (payload or {})|tojson }}</script>
<script>
  var raw = {};
  try { raw = JSON.parse(document.getElementById('flask-data').textContent) || {}; } catch (e) {}
  function clean(v) {
    if (v === null || v === undefined) return null;
    if (typeof v === 'string') {
      var s = v.trim();
      return (s === '' || /^(none|null)$/i.test(s)) ? null : s;
    }
    return v;
  }

  var root = document.documentElement;
  var picker = document.getElementById('picker'), hex = document.getElementById('hex'),
      hidden = document.getElementById('color'), swatch = document.getElementById('swatch'),
      userInput = document.getElementById('username'), userBox = document.getElementById('userBox'),
      hexBox = document.getElementById('hexBox'), status = document.getElementById('status'),
      form = document.getElementById('form'), btn = document.getElementById('btn');

  function parseHex(v) {
    var s = String(v || '').trim().replace(/^#/, '').toLowerCase();
    if (/^[0-9a-f]{3}$/.test(s)) s = s.split('').map(function (c) { return c + c; }).join('');
    return /^[0-9a-f]{6}$/.test(s) ? '#' + s : null;
  }

  function applyColor(c) {
    root.style.setProperty('--accent', c);
    var r = parseInt(c.slice(1, 3), 16), g = parseInt(c.slice(3, 5), 16), b = parseInt(c.slice(5, 7), 16);
    var lum = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
    root.style.setProperty('--on-accent', lum > 0.55 ? '#000000' : '#ffffff');
    picker.value = c; hidden.value = c; swatch.style.background = c;
  }

  function say(msg, kind) { status.textContent = msg; status.className = 'status' + (kind ? ' ' + kind : ''); }

  picker.addEventListener('input', function () {
    hex.value = picker.value.slice(1);
    hexBox.classList.remove('bad'); say('');
    applyColor(picker.value);
  });
  hex.addEventListener('input', function () {
    var c = parseHex(hex.value);
    hexBox.classList.toggle('bad', !c && hex.value.trim() !== '');
    if (c) { say(''); applyColor(c); }
  });
  userInput.addEventListener('input', function () { userBox.classList.remove('bad'); say(''); });

  var initColor = parseHex(clean(raw.color)) || '#ffffff';
  applyColor(initColor); hex.value = initColor.slice(1);
  var initName = clean(raw.name);
  if (typeof initName === 'string') userInput.value = initName;

  form.addEventListener('submit', function (e) {
    var nm = userInput.value.trim();
    var c = parseHex(hex.value);
    if (!nm) {
      e.preventDefault(); userBox.classList.add('bad');
      say('Digite um nome de usuário.', 'err'); userInput.focus(); return;
    }
    if (!c) {
      e.preventDefault(); hexBox.classList.add('bad');
      say('Cor inválida. Use 3 ou 6 dígitos hexadecimais (ex.: ff4d6d).', 'err'); hex.focus(); return;
    }
    userInput.value = nm; hidden.value = c;
    btn.disabled = true; btn.textContent = 'Enviando…';
  });

  window.addEventListener('pageshow', function () { btn.disabled = false; btn.textContent = 'Continuar'; });
</script>
</body>
</html>
